name: CI

on: 
  push:
  workflow_dispatch:

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15" 

      - name: Run tests
        run: python3 -m unittest test_figures.py

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15" 

      - name: Run tests 
        run: python -m unittest test_figures.py
